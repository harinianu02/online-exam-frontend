<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exam Result</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="result-container">
  <div class="result-card">

    <h2>📄 Exam Result</h2>

    <p><strong>Student Name:</strong> <span id="studentName"></span></p>
    <p><strong>Total Questions:</strong> <span id="totalQuestions"></span></p>
    <p><strong>Total Marks:</strong> <span id="totalMarks"></span></p>
    <p><strong>Marks Obtained:</strong> <span id="score"></span></p>
    <p><strong>Percentage:</strong> <span id="percentage"></span>%</p>

    <button class="btn-primary" onclick="logout()">Logout</button>

  </div>
</div>

<script src="../js/result.js"></script>

</body>
</html>
